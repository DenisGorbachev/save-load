[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
homepage = "https://github.com/DenisGorbachev/save-load"
repository = "https://github.com/DenisGorbachev/save-load"
keywords = ["serde", "filesystem", "fs", "serialize", "format"]
categories = ["filesystem", "rendering::data-formats", "value-formatting", "encoding", "rust-patterns"]
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[workspace.metadata.details]
name = "save-load"
title = "Read & write files in JSON, YAML, XML, TOML, RON formats"
readme = { generate = false }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "save-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read & write files in JSON, YAML, XML, TOML, RON formats."
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = "Read & write files in JSON, YAML, XML, TOML, RON formats"

[lints]
workspace = true

[dependencies]
clap = { version = "4.0", optional = true, features = ["derive"] }
csv = { version = "1.0", optional = true }
derive_more = { version = "2.0", features = ["full"] }
quick-xml = { version = "0.39", optional = true, features = ["serialize"] }
ron = { version = "0.12.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde-jsonlines = { version = "0.7", optional = true }
serde-xml-rs = { version = "0.8", optional = true }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }
strum = { version = "0.27", features = ["derive"] }
toml = { version = "0.9", optional = true }
